version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: crm_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Shardul@27
      MYSQL_DATABASE: crm_intelligence
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pShardul@27"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: crm_fastapi_backend
    restart: always
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=crm_intelligence
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Shardul@27
      - OPENAI_API_KEY=YOUR_OPENAI_API_KEY
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: crm_next_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
